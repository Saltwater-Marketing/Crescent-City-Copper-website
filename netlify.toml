# Crescent City Copper: Netlify settings. Every push to the connected branch rebuilds the site.
[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"
  # Set in Netlify (Site configuration > Environment variables), never here:
  #   WC_URL       WordPress to read products and pages from. Until launch: https://crescentcitycopper.com
  #                At launch: https://shop.crescentcitycopper.com
  #   SHOP_URL     where cart / checkout / My Account live (same as WC_URL)
  #   WC_CONSUMER_KEY / WC_CONSUMER_SECRET   optional read-only WooCommerce REST key
  #   SITE_LIVE=true   ONLY at launch: turns on GA4 + Meta Pixel and lets Google index the site

# Photos come from WordPress and are resized + converted to WebP by Netlify Image CDN
[images]
  remote_images = [
    "https://crescentcitycopper\\.com/wp-content/.*",
    "https://shop\\.crescentcitycopper\\.com/wp-content/.*",
  ]

# ---------- Headers ----------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# ---------- Redirects ----------
# www goes to the bare domain (CLAUDE.md decision 5)
[[redirects]]
  from = "https://www.crescentcitycopper.com/*"
  to = "https://crescentcitycopper.com/:splat"
  status = 301
  force = true

# WooCommerce pages live on the shop subdomain after launch (CLAUDE.md decision 1)
[[redirects]]
  from = "/cart/*"
  to = "https://shop.crescentcitycopper.com/cart/:splat"
  status = 301
[[redirects]]
  from = "/checkout/*"
  to = "https://shop.crescentcitycopper.com/checkout/:splat"
  status = 301
[[redirects]]
  from = "/my-account/*"
  to = "https://shop.crescentcitycopper.com/my-account/:splat"
  status = 301
[[redirects]]
  from = "/wp-admin/*"
  to = "https://shop.crescentcitycopper.com/wp-admin/:splat"
  status = 301
[[redirects]]
  from = "/wp-login.php"
  to = "https://shop.crescentcitycopper.com/wp-login.php"
  status = 301
# Old photo and PDF links keep working: the files stay on WordPress
[[redirects]]
  from = "/wp-content/*"
  to = "https://shop.crescentcitycopper.com/wp-content/:splat"
  status = 301
[[redirects]]
  from = "/images/*"
  to = "https://shop.crescentcitycopper.com/images/:splat"
  status = 301

# Pages with no content on the current site (lib/wp.js RETIRED) -> best match
